; PlatformIO Configuration for Minifax
; ESP32 + SIM800L GSM + Thermal Printer

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    vshymanskyy/TinyGSM@^0.11.7
    adafruit/Adafruit Thermal Printer Library@^1.4.0
build_flags =
    -DTINY_GSM_MODEM_SIM800
